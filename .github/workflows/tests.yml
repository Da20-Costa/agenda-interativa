name: Test
on:
  pull_request:
    branches: [main]

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/hydrogen'

      - name: Install dependencies
        run: npm ci

      - name: Run setup script for cretaing database table
        run: npm run setup

      - name: Run the server in the background
        run: npm run dev &

      - name: Wait server to be fully ready
        run: npx wait-on http://localhost:3000

      - name: Run Tests
        run: npm test
