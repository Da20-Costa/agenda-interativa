name: Test
on:
  pull_request:
    branches: [main]

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/hydrogen'

      - name: Install dependencies
        run: npm ci

      - name: Ligar o servidor em segundo plano
        run: npm run dev &

      - name: Esperar o servidor ficar pronto
        run: npx wait-on http://localhost:3000

      - name: Run Tests
        run: npm test
